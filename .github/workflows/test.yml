name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  iq-recorder:
    name: iq-recorder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: iq-recorder
        run: pip install -r requirements.txt

      - name: Run test suite
        working-directory: iq-recorder
        run: pytest -q

  sdr-doppler-prototype:
    name: sdr-doppler-prototype (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: sdr-doppler-prototype
        run: pip install -r requirements.txt

      - name: Run test suite
        working-directory: sdr-doppler-prototype
        run: pytest -q

  # Verifies the real rtl_sdr/rtl_test binary actually installs and runs on
  # each OS (via the exact commands in iq-recorder/README.md), separate
  # from the Python test suite above, which only ever exercises the fake
  # rtl_sdr fixture. No RTL-SDR hardware is attached to these runners, so
  # rtl_test/rtl_sdr are expected to report "no device found" and exit
  # non-zero - the point is confirming the binary itself installs and runs
  # without crashing/hanging, not detecting real hardware. Windows is
  # excluded: there's no reliable package-manager install for it in CI
  # (the README's Windows steps are a manual driver install via Zadig,
  # which can't be automated headlessly).
  real-rtl-sdr-binary-smoke-test:
    name: real rtl_sdr/rtl_test binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Install rtl-sdr (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rtl-sdr

      - name: Install rtl-sdr (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install librtlsdr

      - name: rtl_test -t (no device attached - expected to report none found)
        run: timeout 30 rtl_test -t || true
        shell: bash

      - name: rtl_sdr --help (confirms the binary runs at all)
        run: rtl_sdr --help || true
        shell: bash
